name: Family pilot checks
on:
  push:
    branches: [pilot/child-devices, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:start
      - run: npm test
      - run: npm run e2e
      - name: Prepare closed-pilot configuration on the disposable runner
        run: |
          node --env-file=.env.local scripts/prepare-pilot-smoke.ts
          npm run db:stop
          cat >> supabase/config.toml <<'TOML'
          [auth.hook.before_user_created]
          enabled = true
          uri = "pg-functions://postgres/public/pilot_signup_hook"
          TOML
          npm run db:start
      - name: Rehearse provisioned guardian and paired child on the pilot build
        env:
          VITE_FAMILY_PILOT: 'true'
        run: npm run e2e -- --grep 'dedicated child device'
