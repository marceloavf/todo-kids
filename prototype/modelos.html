<!doctype html>
<!-- Folha de comparação das capturas do protótipo descartável. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo Kids · modelos de tela</title>
<style>
  h2{font-size:15px;font-weight:600;margin:22px 0 4px}
  h2:first-child{margin-top:0}
  p{font-size:13px;color:var(--muted-foreground);margin:0 0 10px;line-height:1.45}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
  figure{margin:0}
  img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:14px}
  figcaption{font-size:13px;margin-top:6px;line-height:1.4}
  figcaption b{display:block;font-weight:600}
  figcaption span{color:var(--muted-foreground)}
</style>
</head>
<body>
<h2>Tela "Hoje" do filho em 390×844</h2>
<p>Mesmos dados nos três modelos: nove tarefas, uma feita e uma esperando o responsável.</p>
<div class="row">
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/A-390.png" alt="Modelo A, lista de cartões agrupada por rotina">
    <figcaption><b>A · Cartões por rotina</b><span>Rola a tela. Alvo de 66 px.</span></figcaption></figure>
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/B-390.png" alt="Modelo B, uma tarefa por vez com botão Feito">
    <figcaption><b>B · Uma por vez</b><span>Sem rolagem. Botão de 92 px.</span></figcaption></figure>
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/C-390.png" alt="Modelo C, quadro de figuras em grade de três colunas">
    <figcaption><b>C · Quadro de figuras</b><span>Sem rolagem. Blocos de 114 px.</span></figcaption></figure>
</div>

<h2>Os mesmos modelos em 360×640, um celular pequeno</h2>
<div class="row">
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/A-360.png" alt="Modelo A em tela pequena">
    <figcaption><b>A</b><span>Mostra cinco das nove tarefas.</span></figcaption></figure>
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/B-360.png" alt="Modelo B em tela pequena">
    <figcaption><b>B</b><span>Cabe inteiro.</span></figcaption></figure>
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/C-360.png" alt="Modelo C em tela pequena">
    <figcaption><b>C</b><span>Cabe inteiro. Blocos de 104 px.</span></figcaption></figure>
</div>

<h2>Demais telas, em um único layout</h2>
<div class="row">
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/perfis-390.png" alt="Tela de escolha de perfil">
    <figcaption><b>Perfis</b><span>Filho toca no avatar. Responsável usa PIN.</span></figcaption></figure>
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/recompensas-390.png" alt="Tela de recompensas do filho">
    <figcaption><b>Recompensas</b><span>Custo, quanto falta e pedido de resgate.</span></figcaption></figure>
  <figure><img src="/home/marceloavf/Projects/todo-kids/prototype/shots/responsavel-390.png" alt="Tela inicial do responsável">
    <figcaption><b>Responsável</b><span>Pendências no topo, com aprovação em lote.</span></figcaption></figure>
</div>
</body>
</html>
